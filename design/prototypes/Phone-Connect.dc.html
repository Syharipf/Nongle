<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Nongle HP — Terhubung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
body{margin:0;background:#0D1017}
a{color:#EDEDED}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0D1017; color: #EDEDED; font-family: 'Geist', system-ui, sans-serif; box-sizing: border-box; padding: 60px 20px 24px; display: flex; flex-direction: column; gap: 28px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-weight: 600; font-size: 19px; letter-spacing: -0.03em">nongle<span style="color: #FF2D55">.</span></span>
    <span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: #8C93A3">K7Q-4XM</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 24px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #30D158">
      <span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #30D158"></span>
      Terhubung ke laptop
    </div>
    <h1 style="margin: 0; font-weight: 600; font-size: 34px; line-height: 1.05; letter-spacing: -0.035em">Siap jadi remote</h1>
    <div style="font-size: 15px; color: #8C93A3">[nama-file].pdf · 24 slide</div>
  </div>

  <div style="background: #171B24; border-radius: 18px; padding: 0 16px">
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid #252B38">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <div style="font-weight: 500; font-size: 15px">Sensor gerak</div>
        <div style="font-size: 13px; line-height: 1.4; color: #8C93A3">Untuk Air Pointer. Tanpa izin, laser tetap jalan lewat touchpad.</div>
      </div>
      <sc-if value="{{motionPending}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{grantMotion}}" style="flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #3B5BFF; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Izinkan</button>
      </sc-if>
      <sc-if value="{{motionOk}}" hint-placeholder-val="{{ false }}">
        <span style="flex: none; font-size: 14px; color: #30D158">Aktif</span>
      </sc-if>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid #252B38">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <div style="font-weight: 500; font-size: 15px">Layar tetap menyala</div>
        <div style="font-size: 13px; color: #8C93A3">Supaya remote tidak putus saat HP terkunci</div>
      </div>
      <button type="button" role="switch" aria-checked="{{wakeAria}}" aria-label="Layar tetap menyala" onClick="{{toggleWake}}" style="flex: none; position: relative; width: 48px; height: 28px; border-radius: 999px; border: none; padding: 0; cursor: pointer; background: {{wakeTrack}}">
        <span aria-hidden="true" style="position: absolute; top: 3px; left: {{wakeKnob}}; width: 22px; height: 22px; border-radius: 50%; background: {{wakeDot}}"></span>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; padding: 16px 0">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
        <div style="font-weight: 500; font-size: 15px">Getar saat ditekan</div>
        <div style="font-size: 13px; color: #8C93A3">Belum didukung di iPhone</div>
      </div>
      <button type="button" role="switch" aria-checked="{{hapticAria}}" aria-label="Getar saat ditekan" onClick="{{toggleHaptic}}" style="flex: none; position: relative; width: 48px; height: 28px; border-radius: 999px; border: none; padding: 0; cursor: pointer; background: {{hapticTrack}}">
        <span aria-hidden="true" style="position: absolute; top: 3px; left: {{hapticKnob}}; width: 22px; height: 22px; border-radius: 50%; background: {{hapticDot}}"></span>
      </button>
    </div>
  </div>

  <div style="flex: 1"></div>

  <a href="Phone-OneHand.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 60px; border-radius: 18px; background: #3B5BFF; color: #FFFFFF; font-weight: 600; font-size: 17px; text-decoration: none">
    Buka remote
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { motion: false, wake: true, haptic: true };
  }
  renderVals() {
    var s = this.state;
    var sw = function (on) { return { track: on ? '#3B5BFF' : '#2C3242', knob: on ? '23px' : '3px', dot: on ? '#FFFFFF' : '#8C93A3', aria: on ? 'true' : 'false' }; };
    var w = sw(s.wake), h = sw(s.haptic);
    return {
      motionPending: !s.motion,
      motionOk: s.motion,
      grantMotion: () => this.setState({ motion: true }),
      wakeAria: w.aria, wakeTrack: w.track, wakeKnob: w.knob, wakeDot: w.dot,
      toggleWake: () => this.setState({ wake: !s.wake }),
      hapticAria: h.aria, hapticTrack: h.track, hapticKnob: h.knob, hapticDot: h.dot,
      toggleHaptic: () => this.setState({ haptic: !s.haptic })
    };
  }
}
</script>
</body>
</html>
