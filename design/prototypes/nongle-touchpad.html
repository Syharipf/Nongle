<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D1017">
<title>Nongle — Laser pointer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#0D1017; --surface:#171B24; --surface-2:#1E2330; --pad:#12161F;
    --text:#EDEDED; --muted:#8C93A3; --muted-2:#A3A9B7; --soft:#C5CAD5;
    --accent:#3B5BFF; --laser:#FF2D55;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Geist',system-ui,sans-serif;overscroll-behavior:none}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
  .top{display:flex;align-items:center;gap:10px;min-height:44px}
  .icon-btn{width:44px;height:44px;border-radius:12px;border:none;background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center}
  .title{flex:1;font-weight:600;font-size:20px;letter-spacing:-0.02em}
  .count{font-family:'Geist Mono',monospace;font-size:14px;color:var(--muted)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface)}
  .seg button{min-height:40px;border-radius:9px;border:none;background:transparent;color:var(--muted-2);font-weight:500;font-size:15px}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .row{display:flex;align-items:center;gap:14px}
  .minimap{position:relative;flex:none;width:112px;height:63px;border-radius:8px;background:var(--surface-2);overflow:hidden}
  .minimap span{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--laser);box-shadow:0 0 0 1.5px #fff;opacity:.35;transition:opacity .15s}
  .minimap span.on{opacity:1}
  .label{font-size:13px;color:var(--muted)}
  .swatches{display:flex;gap:2px;margin-left:-8px}
  .swatches button{width:44px;height:44px;border:none;padding:0;background:transparent;display:flex;align-items:center;justify-content:center}
  .swatches i{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px #fff}
  .swatches button[aria-pressed="true"] i{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--bg),0 0 0 6.5px var(--text)}
  .pad{position:relative;flex:1;min-height:200px;border-radius:24px;background:var(--pad);overflow:hidden;cursor:crosshair;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .pad canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hint{position:absolute;left:0;right:0;bottom:22px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;transition:opacity .2s}
  .hint b{font-size:15px;font-weight:500;color:var(--soft)}
  .hint small{font-size:13px;color:var(--muted)}
  .pad.pressing .hint{opacity:0}
  .air{flex:1;border-radius:24px;background:#161B27;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:20px}
  .air p{margin:0;font-size:14px;line-height:1.5;color:var(--muted);text-align:center;max-width:250px}
  .hold{position:relative;width:168px;height:168px;color:var(--laser)}
  .hold button{position:absolute;inset:0;border-radius:50%;border:none;background:#EDEDED;color:var(--bg);font-weight:600;font-size:17px;touch-action:none}
  .hold.on button{background:#fff}
  .pulse{position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;pointer-events:none;opacity:0}
  .hold.on .pulse{animation:pulse 1.4s ease-out infinite}
  .hold.on .pulse.d2{animation-delay:.7s}
  @keyframes pulse{from{transform:scale(1);opacity:.75}to{transform:scale(1.55);opacity:0}}
  .ghost{min-height:44px;padding:0 16px;border-radius:10px;border:none;background:var(--surface-2);color:var(--text);font-weight:500;font-size:14px}
  .app.air-mode .pad{display:none}
  .app.air-mode .air{display:flex}
  .nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .nav button{min-height:64px;border-radius:18px;border:none;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .nav .prev{background:var(--surface-2);color:var(--text);font-weight:500}
  .nav .next{background:var(--accent);color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <button class="icon-btn" type="button" aria-label="Kembali ke remote">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <div class="title">Laser</div>
    <span class="count" id="count">12 / 24</span>
  </div>

  <div class="seg" role="group" aria-label="Mode laser">
    <button type="button" id="mTouch" aria-pressed="true">Touchpad</button>
    <button type="button" id="mAir" aria-pressed="false">Air (gyro)</button>
  </div>

  <div class="row">
    <div class="minimap" role="img" aria-label="Posisi laser di layar proyektor"><span id="dot"></span></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:2px">
      <div class="label">Warna laser</div>
      <div class="swatches" role="group" aria-label="Warna laser" id="swatches">
        <button type="button" data-c="#FF2D55" aria-label="Laser merah" aria-pressed="true"><i style="background:#FF2D55"></i></button>
        <button type="button" data-c="#FFD60A" aria-label="Laser kuning" aria-pressed="false"><i style="background:#FFD60A"></i></button>
        <button type="button" data-c="#30D158" aria-label="Laser hijau" aria-pressed="false"><i style="background:#30D158"></i></button>
      </div>
    </div>
  </div>

  <div class="pad" id="pad" role="group" aria-label="Touchpad laser, tekan dan geser">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="hint"><b>Tekan &amp; geser</b><small>Laser nyala selama jari menempel</small></div>
  </div>

  <div class="air">
    <p>Arahkan HP ke layar, lalu tahan. Laser mengikuti gerak tangan.</p>
    <div class="hold" id="hold">
      <span class="pulse"></span><span class="pulse d2"></span>
      <button type="button" id="holdBtn">Tahan</button>
    </div>
    <button class="ghost" type="button">Kalibrasi ke tengah layar</button>
  </div>

  <div class="nav">
    <button class="prev" type="button" id="prev" aria-label="Slide sebelumnya">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>Prev
    </button>
    <button class="next" type="button" id="next" aria-label="Slide berikutnya">
      Next<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
    </button>
  </div>
</div>

<script>
(() => {
  // ---------- Konfigurasi efek grid ----------
  const CFG = {
    gridSize: 22,      // jarak garis grid (px). Perbesar kalau HP lambat.
    bulgeRadius: 66,   // jari-jari area yang "terangkat"
    bulgeStrength: 20, // seberapa jauh grid terdorong keluar
    springK: 230,      // kekakuan pegas (lebih besar = lebih cepat)
    springDamp: 13,    // redaman (lebih kecil = lebih memantul)
    waveSpeed: 300,    // kecepatan gelombang (px/detik)
    waveLife: 1.1,     // umur gelombang (detik)
    waveAmp: 7,        // tinggi gelombang
    baseRGB: [120, 132, 158]
  };

  const $ = (id) => document.getElementById(id);
  const app = $('app'), pad = $('pad'), cv = $('cv'), dotEl = $('dot');
  let color = '#FF2D55';
  let slide = 12, total = 24;
  let lx = 0.55, ly = 0.45;

  const g = { amp: 0, vel: 0, target: 0, cx: 0, cy: 0, tx: 0, ty: 0, waves: [], last: 0 };
  let raf = null, pressing = false, lastP = null, waveP = null, waveT = 0;

  const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
  const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };

  function updateDot() {
    dotEl.style.left = (lx * 100).toFixed(1) + '%';
    dotEl.style.top = (ly * 100).toFixed(1) + '%';
    dotEl.style.background = color;
  }

  function frame(now) {
    raf = null;
    const dt = g.last ? Math.min(0.05, (now - g.last) / 1000) : 0.016; g.last = now;
    g.vel += (CFG.springK * (g.target - g.amp) - CFG.springDamp * g.vel) * dt;
    g.amp += g.vel * dt;
    const k = Math.min(1, dt * 22);
    g.cx += (g.tx - g.cx) * k; g.cy += (g.ty - g.cy) * k;
    g.waves = g.waves.filter((w) => now - w.t < CFG.waveLife * 1000);

    const w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    }
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const amp = Math.max(-0.4, g.amp), { cx, cy, waves } = g;
    const base = CFG.baseRGB, lc = rgb(color);
    const S = CFG.gridSize, sig = CFG.bulgeRadius;
    const cols = Math.ceil(w / S) + 2, rows = Math.ceil(h / S) + 2;
    const ox = (w - (cols - 1) * S) / 2, oy = (h - (rows - 1) * S) / 2;
    const P = new Float32Array(cols * rows * 2), L = new Float32Array(cols * rows);

    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const x = ox + i * S, y = oy + j * S;
        const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 0.001;
        const q = d / sig;
        // Lensa: titik didorong keluar, maksimum di jarak = sig, nol di pusat
        const push = amp * CFG.bulgeStrength * q * Math.exp(0.5 - q * q / 2);
        let lift = Math.max(0, amp) * Math.exp(-(d * d) / (2 * (sig * 1.25) ** 2));
        let px = x + dx / d * push, py = y + dy / d * push;
        for (const wv of waves) {
          const age = (now - wv.t) / 1000;
          const wx = x - wv.x, wy = y - wv.y, wd = Math.hypot(wx, wy) || 0.001;
          const band = wd - CFG.waveSpeed * age;
          const fade = (1 - age / CFG.waveLife) ** 2;
          const s = CFG.waveAmp * wv.a * fade * Math.exp(-(band * band) / (2 * 15 * 15));
          px += wx / wd * s; py += wy / wd * s;
          lift += 0.35 * s / CFG.waveAmp;
        }
        const id = j * cols + i;
        P[id * 2] = px; P[id * 2 + 1] = py; L[id] = Math.min(1, lift);
      }
    }

    // Cahaya lembut di bawah area yang terangkat
    if (amp > 0.02) {
      const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, 110);
      gr.addColorStop(0, `rgba(${lc[0]},${lc[1]},${lc[2]},${0.14 * Math.min(1, amp)})`);
      gr.addColorStop(1, `rgba(${lc[0]},${lc[1]},${lc[2]},0)`);
      ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);
    }

    const seg = (a, b) => {
      const t = (L[a] + L[b]) / 2;
      const r = Math.round(base[0] + (lc[0] - base[0]) * t * 0.9);
      const gg = Math.round(base[1] + (lc[1] - base[1]) * t * 0.9);
      const bb = Math.round(base[2] + (lc[2] - base[2]) * t * 0.9);
      ctx.strokeStyle = `rgba(${r},${gg},${bb},${0.16 + 0.6 * t})`;
      ctx.lineWidth = 1 + 0.8 * t;
      ctx.beginPath(); ctx.moveTo(P[a * 2], P[a * 2 + 1]); ctx.lineTo(P[b * 2], P[b * 2 + 1]); ctx.stroke();
    };
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const id = j * cols + i;
        if (i < cols - 1) seg(id, id + 1);
        if (j < rows - 1) seg(id, id + cols);
      }
    }

    // Titik laser: inti warna + cincin putih + garis gelap (terlihat di slide terang & gelap)
    if (g.target > 0 || amp > 0.15) {
      ctx.globalAlpha = Math.min(1, Math.max(0, amp));
      ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, 8.5, 0, Math.PI * 2); ctx.fillStyle = '#FFFFFF'; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
      ctx.globalAlpha = 1;
    }

    const active = g.target > 0 || Math.abs(g.amp) > 0.002 || Math.abs(g.vel) > 0.002 || waves.length > 0;
    if (active) raf = requestAnimationFrame(frame);
    else { g.amp = 0; g.vel = 0; g.last = 0; }
  }

  const pt = (e) => { const r = pad.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const addWave = (p, a) => { g.waves.push({ x: p.x, y: p.y, t: performance.now(), a }); if (g.waves.length > 8) g.waves.shift(); };

  pad.addEventListener('pointerdown', (e) => {
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
    const p = pt(e);
    if (Math.abs(g.amp) < 0.05) { g.cx = p.x; g.cy = p.y; }
    g.tx = p.x; g.ty = p.y; g.target = 1;
    lastP = p; waveP = p; waveT = performance.now();
    addWave(p, 1);
    pressing = true; pad.classList.add('pressing'); dotEl.classList.add('on');
    buzz(8);
    // TODO: kirim {type:'laser', on:true} lewat WebSocket
    kick();
  });

  pad.addEventListener('pointermove', (e) => {
    if (!pressing || !lastP) return;
    const p = pt(e), now = performance.now();
    g.tx = p.x; g.ty = p.y;
    if (Math.hypot(p.x - waveP.x, p.y - waveP.y) > 22 && now - waveT > 70) { addWave(p, 0.6); waveP = p; waveT = now; }
    const w = pad.clientWidth || 358;
    lx = Math.min(1, Math.max(0, lx + (p.x - lastP.x) / w * 1.1));
    ly = Math.min(1, Math.max(0, ly + (p.y - lastP.y) / w * 1.9));
    lastP = p;
    updateDot();
    // TODO: kirim {type:'laser', x:lx, y:ly} lewat WebSocket (throttle ~60Hz)
    kick();
  });

  const release = () => {
    if (!pressing) return;
    pressing = false; g.target = 0;
    if (lastP) addWave(lastP, 0.5);
    lastP = null;
    pad.classList.remove('pressing'); dotEl.classList.remove('on');
    // TODO: kirim {type:'laser', on:false} lewat WebSocket
    kick();
  };
  pad.addEventListener('pointerup', release);
  pad.addEventListener('pointercancel', release);

  // Mode Touchpad / Air
  const setMode = (air) => {
    app.classList.toggle('air-mode', air);
    $('mTouch').setAttribute('aria-pressed', String(!air));
    $('mAir').setAttribute('aria-pressed', String(air));
    if (!air) { g.cx = g.tx = pad.clientWidth / 2; g.cy = g.ty = pad.clientHeight / 2; kick(); }
  };
  $('mTouch').addEventListener('click', () => setMode(false));
  $('mAir').addEventListener('click', async () => {
    // iOS: izin sensor gerak wajib diminta dari gesture pengguna
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        await DeviceOrientationEvent.requestPermission();
      }
    } catch (err) {}
    setMode(true);
  });

  // Tombol tahan (Air pointer)
  const hold = $('hold'), holdBtn = $('holdBtn');
  const airOn = () => { hold.classList.add('on'); holdBtn.textContent = 'Laser aktif'; dotEl.classList.add('on'); buzz(8); };
  const airOff = () => { hold.classList.remove('on'); holdBtn.textContent = 'Tahan'; dotEl.classList.remove('on'); };
  holdBtn.addEventListener('pointerdown', airOn);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => holdBtn.addEventListener(ev, airOff));

  // Warna laser
  $('swatches').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    color = b.dataset.c;
    document.documentElement.style.setProperty('--laser', color);
    [...$('swatches').children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    updateDot(); kick();
  });

  // Prev / Next
  const setCount = () => { $('count').textContent = `${slide} / ${total}`; };
  $('next').addEventListener('click', () => { if (slide < total) { slide++; buzz(10); setCount(); } });
  $('prev').addEventListener('click', () => { if (slide > 1) { slide--; buzz([10, 60, 10]); setCount(); } });

  // Init
  requestAnimationFrame(() => { g.cx = g.tx = pad.clientWidth / 2; g.cy = g.ty = pad.clientHeight / 2; updateDot(); kick(); });
  window.addEventListener('resize', kick);
})();
</script>
</body>
</html>
