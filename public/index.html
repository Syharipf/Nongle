<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nongle - Zero-Dongle Presentation Hub</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B0F19">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #0B0F19;
      --card: #161F30;
      --border: #1E293B;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --accent: #3B82F6;
      --danger: #EF4444;
      --success: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    header {
      height: 56px;
      padding: 0 20px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      transition: opacity 0.3s;
    }
    .fullscreen header { opacity: 0; pointer-events: none; }
    .fullscreen:hover header { opacity: 1; pointer-events: auto; }
    .brand { font-weight: 700; font-size: 18px; color: var(--accent); }
    .controls { display: flex; gap: 12px; align-items: center; }
    button, label.btn {
      background: var(--border);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover, label.btn:hover { background: #27354f; }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.primary:hover { background: #2563EB; }
    input[type="file"] { display: none; }
    input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      width: 200px;
    }
    #stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #slide-builtin {
      width: 90%;
      height: 80%;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }
    #slide-builtin h1 { font-size: 42px; margin-bottom: 16px; color: var(--accent); }
    #slide-builtin p { font-size: 20px; color: var(--muted); max-width: 600px; line-height: 1.6; }

    #blackout {
      position: absolute;
      inset: 0;
      background: #000;
      display: none;
      z-index: 50;
    }
    #blackout.active { display: block; }

    #laser-pointer {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #EF4444;
      box-shadow: 0 0 12px 3px rgba(239, 68, 68, 0.9), 0 0 24px 6px rgba(239, 68, 68, 0.5);
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 100;
      transition: left 0.04s linear, top 0.04s linear;
    }

    #qr-card {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      z-index: 40;
    }
    #qrcode { background: #fff; padding: 8px; border-radius: 8px; }
    .qr-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .qr-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--border);
      color: var(--muted);
    }
    .qr-badge.connected { background: rgba(16,185,129,0.2); color: var(--success); }
    #status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748B; }
    .dot.live { background: var(--success); }
  </style>
</head>
<body>
  <header>
    <div class="brand">Nongle</div>
    <div class="controls">
      <div id="status-pill"><span class="dot" id="net-dot"></span> <span id="net-text">Connecting...</span></div>
      <label class="btn" title="Buka File PDF Presentasi">
        📂 Buka PDF / Slide
        <input type="file" id="file-input" accept="application/pdf,image/*">
      </label>
      <input type="text" id="embed-url" placeholder="Paste link Google Slides/Web">
      <button id="btn-load-embed">Load Link</button>
      <button class="primary" id="btn-fullscreen">⛶ Fullscreen</button>
    </div>
  </header>

  <main id="stage">
    <div id="canvas-container">
      <canvas id="pdf-canvas" style="display:none;"></canvas>
      <iframe id="embed-frame" style="display:none;"></iframe>
      <div id="slide-builtin">
        <h1 id="b-title">Nongle</h1>
        <p id="b-desc">Kendalikan slide dari HP tanpa dongle USB atau aplikasi tambahan.</p>
        <p style="margin-top:20px; font-size:14px; color:var(--text);">Buka file PDF via tombol di atas untuk memuat slide presentasi lokal.</p>
      </div>
    </div>
    <div id="blackout"></div>
    <div id="laser-pointer"></div>

    <div id="qr-card">
      <div class="qr-title">Scan via Kamera HP</div>
      <div id="qrcode"></div>
      <div class="qr-badge" id="remote-count">Menunggu HP terhubung...</div>
    </div>
  </main>

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let ws = null;
    let roomId = null;
    let mode = 'builtin';
    let currentSlide = 1;
    let totalSlides = 3;
    let pdfDoc = null;
    let isBlackout = false;

    const builtinSlides = [
      { title: "Nongle: Zero-Dongle Presenter", desc: "Kendalikan laptop langsung dari browser HP via Cloud Relay WSS tanpa install app apapun." },
      { title: "Kebal Firewall", desc: "Berjalan di atas port HTTPS 443 murni. Aman menembus firewall kampus, kantor, atau hotel." },
      { title: "Mulai Sekarang", desc: "Buka file PDF lewat tombol di header atau kendalikan slide demo ini dengan HP." }
    ];

    function initWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => {
        document.getElementById('net-dot').classList.add('live');
        document.getElementById('net-text').textContent = 'Server Online (WSS)';
        ws.send(JSON.stringify({ type: 'CREATE_ROOM' }));
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'ROOM_CREATED') {
          roomId = msg.roomId;
          generateQR();
          syncState();
        } else if (msg.type === 'REMOTE_CONNECTED') {
          const badge = document.getElementById('remote-count');
          badge.textContent = `${msg.count} HP Terhubung`;
          badge.classList.add('connected');
        } else if (msg.type === 'REMOTE_DISCONNECTED') {
          const badge = document.getElementById('remote-count');
          badge.textContent = msg.count > 0 ? `${msg.count} HP Terhubung` : 'Menunggu HP...';
          if (msg.count === 0) badge.classList.remove('connected');
        } else if (msg.type === 'NAVIGATE') {
          if (msg.action === 'NEXT') nextSlide();
          if (msg.action === 'PREV') prevSlide();
          if (msg.action === 'GOTO') goToSlide(msg.targetSlide);
        } else if (msg.type === 'BLACKOUT_UPDATED') {
          setBlackout(msg.isBlackout);
        } else if (msg.type === 'POINTER_MOVE') {
          const laser = document.getElementById('laser-pointer');
          if (msg.visible) {
            laser.style.display = 'block';
            laser.style.left = `${msg.x}%`;
            laser.style.top = `${msg.y}%`;
          } else {
            laser.style.display = 'none';
          }
        }
      };

      ws.onclose = () => {
        document.getElementById('net-dot').classList.remove('live');
        document.getElementById('net-text').textContent = 'Terputus (Reconnect...)';
        setTimeout(initWS, 2000);
      };
    }

    async function generateQR() {
      let host = location.host;
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        try {
          const res = await fetch('/api/info');
          const data = await res.json();
          if (data.ip && data.ip !== 'localhost') {
            host = `${data.ip}:${data.port || location.port || 3000}`;
          }
        } catch {}
      }
      const remoteUrl = `${location.protocol}//${host}/remote.html?room=${roomId}`;
      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), {
        text: remoteUrl,
        width: 140,
        height: 140,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.M
      });
    }

    function syncState() {
      if (ws && ws.readyState === WebSocket.OPEN && roomId) {
        ws.send(JSON.stringify({
          type: 'UPDATE_STATE',
          currentSlide,
          totalSlides
        }));
      }
    }

    function renderSlide() {
      if (mode === 'builtin') {
        const slide = builtinSlides[currentSlide - 1];
        document.getElementById('b-title').textContent = slide.title;
        document.getElementById('b-desc').textContent = slide.desc;
      } else if (mode === 'pdf' && pdfDoc) {
        pdfDoc.getPage(currentSlide).then(page => {
          const canvas = document.getElementById('pdf-canvas');
          const ctx = canvas.getContext('2d');
          const viewport = page.getViewport({ scale: 2 });
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          page.render({ canvasContext: ctx, viewport });
        });
      }
      syncState();
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 1) {
        currentSlide--;
        renderSlide();
      }
    }

    function goToSlide(n) {
      if (n >= 1 && n <= totalSlides) {
        currentSlide = n;
        renderSlide();
      }
    }

    function setBlackout(active) {
      isBlackout = Boolean(active);
      document.getElementById('blackout').classList.toggle('active', isBlackout);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'b' || e.key === 'B') {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'SET_BLACKOUT', state: !isBlackout }));
        }
      }
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        document.body.classList.add('fullscreen');
      } else {
        document.exitFullscreen();
        document.body.classList.remove('fullscreen');
      }
    }

    document.getElementById('btn-fullscreen').onclick = toggleFullscreen;

    document.getElementById('file-input').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function() {
        const typedarray = new Uint8Array(this.result);
        pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
        totalSlides = pdfDoc.numPages;
        currentSlide = 1;
        mode = 'pdf';
        document.getElementById('slide-builtin').style.display = 'none';
        document.getElementById('embed-frame').style.display = 'none';
        document.getElementById('pdf-canvas').style.display = 'block';
        renderSlide();
      };
      reader.readAsArrayBuffer(file);
    };

    document.getElementById('btn-load-embed').onclick = () => {
      const url = document.getElementById('embed-url').value.trim();
      if (!url) return;
      mode = 'embed';
      document.getElementById('slide-builtin').style.display = 'none';
      document.getElementById('pdf-canvas').style.display = 'none';
      const frame = document.getElementById('embed-frame');
      frame.src = url;
      frame.style.display = 'block';
    };

    initWS();
  </script>
</body>
</html>
